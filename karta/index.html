<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karta z Akademii</title>
  <meta name="description" content="Jedna karta z Niezbędnika Akademii, do podejrzenia bez hasła.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/start.css">
  <!-- Celowo bez bramki: ta strona pokazuje jedną kartę, której treść i tak jest jawna w repozytorium. -->
</head>
<body>
  <header class="top">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#16202A"/>
        <rect x="6" y="6" width="9" height="9" rx="2" fill="#F2620F"/>
        <rect x="17" y="6" width="9" height="9" rx="2" fill="#34A853"/>
        <rect x="6" y="17" width="9" height="9" rx="2" fill="#8A9AAA"/>
        <rect x="17.75" y="17.75" width="7.5" height="7.5" rx="1.75" fill="none" stroke="#8A9AAA" stroke-width="1.5" stroke-dasharray="3 2.5"/>
      </svg>
      <span>Akademia</span>
    </span>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <footer class="foot">
    <span class="foot-note">Akademia to domowy kurs dla młodych ludzi. Ta karta jest publiczna, reszta Akademii jest za hasłem.</span>
  </footer>

  <script src="../js/kursy.js"></script>
  <script src="../js/postep.js"></script>
  <script src="../js/karta.js"></script>
</body>
</html>
